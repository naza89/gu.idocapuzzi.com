           x="0"
           y="0"
           xlink:href="#rect1"
           id="use20" /></flowRegion><flowPara
         id="flowPara20">EL SELVEDGE CRUDO SE VIVE Y SE CUIDA. LAVALO LO MENOS POSIBLE Y SIEMPRE DEL REVÉS. RECOMENDAMOS EL LAVADO A MANO: SUMERGILO 30 A 45 MINUTOS EN AGUA FRÍA CON JABÓN NEUTRO, SIN FROTAR, Y ENJUAGÁ EN FRÍO HASTA QUITAR EL JABÓN. ESCURRILO CON CUIDADO, SIN RETORCER. SI USÁS LAVARROPAS, ELEGÍ EL CICLO MÁS DELICADO. SECALO COLGADO EN VERTICAL DESDE LA CINTURA, A LA SOMBRA. EVITÁ EL SOL Y, SOBRE TODO, LA SECADORA.</flowPara></flowRoot><text
